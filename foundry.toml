[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
gas_reports = ["PredictionMarket", "MarketAMM", "MarketFactory", "FeeVault", "PredictionGovernor", "GovernanceToken"]
fs_permissions = [{ access = "read-write", path = "./" }]
verbosity = 2
ffi = false

# Strict formatter
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

# Profile for CI: stricter, more verbose
[profile.ci]
fuzz = { runs = 5000 }
invariant = { runs = 256, depth = 50, fail_on_revert = false }
verbosity = 4

# Profile for deep fuzzing locally
[profile.deep]
fuzz = { runs = 50_000 }
invariant = { runs = 1000, depth = 100 }

[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api" }
arbitrum = { key = "${ARBISCAN_API_KEY}", url = "https://api.arbiscan.io/api" }
