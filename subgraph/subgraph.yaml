specVersion: 1.0.0
indexerHints:
  prune: auto

schema:
  file: ./schema.graphql

dataSources:
  # ── MarketFactory ────────────────────────────────────────────────────────────
  - kind: ethereum
    name: MarketFactory
    network: arbitrum-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"   # replaced at deploy
      abi: MarketFactory
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Market
        - Factory
      abis:
        - name: MarketFactory
          file: ./abis/MarketFactory.json
      eventHandlers:
        - event: MarketCreated(indexed address,indexed address,indexed address,bytes32,int256,uint64,string)
          handler: handleMarketCreated
      file: ./src/factory.ts

  # ── PredictionMarket (template, one per market) ───────────────────────────────
  - kind: ethereum/contract/template
    name: PredictionMarket
    network: arbitrum-sepolia
    source:
      abi: PredictionMarket
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Market
        - Swap
        - LiquidityEvent
        - Claim
        - MarketResolution
      abis:
        - name: PredictionMarket
          file: ./abis/PredictionMarket.json
      eventHandlers:
        - event: LiquidityAdded(indexed address,uint256,uint256)
          handler: handleLiquidityAdded
        - event: LiquidityRemoved(indexed address,uint256,uint256,uint256)
          handler: handleLiquidityRemoved
        - event: Swap(indexed address,bool,uint256,uint256,uint256,uint256)
          handler: handleSwap
        - event: WinningsClaimed(indexed address,uint256,uint256)
          handler: handleClaimed
        - event: OutcomeResolved(indexed uint8,indexed address,int256)
          handler: handleResolved
        - event: MarketStateChanged(indexed uint8,indexed uint8)
          handler: handleStateChanged
        - event: DisputeRaised(indexed address,string)
          handler: handleDisputed
      file: ./src/market.ts

  # ── GovernanceToken ───────────────────────────────────────────────────────────
  - kind: ethereum
    name: GovernanceToken
    network: arbitrum-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: GovernanceToken
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - TokenHolder
        - DelegateEvent
      abis:
        - name: GovernanceToken
          file: ./abis/GovernanceToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: DelegateChanged(indexed address,indexed address,indexed address)
          handler: handleDelegateChanged
      file: ./src/governance.ts

  # ── FeeVault ─────────────────────────────────────────────────────────────────
  - kind: ethereum
    name: FeeVault
    network: arbitrum-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: FeeVault
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - VaultSnapshot
        - FeeEvent
      abis:
        - name: FeeVault
          file: ./abis/FeeVault.json
      eventHandlers:
        - event: FeeForwarded(indexed address,uint256)
          handler: handleFeeForwarded
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleVaultDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleVaultWithdraw
      file: ./src/vault.ts
